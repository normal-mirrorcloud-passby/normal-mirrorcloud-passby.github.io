<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 | 林屿 个人档案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f5f2ed;
    color:#4a4642;
    font-family:system-ui, sans-serif;
    line-height:1.7;
}
.page-wrapper{
    max-width:1200px;
    margin:0 auto;
    padding:2rem;
}
.main-nav{
    margin-bottom:3rem;
}
.main-nav a{
    color:#6c6965;
    text-decoration:none;
    margin-right:1.5rem;
}
.main-nav a:hover{
    color:#4a4642;
}
.section{
    margin:4rem 0;
}
h2{
    font-size:1rem;
    color:#6c6965;
    letter-spacing:0.2em;
    padding-bottom:0.5rem;
    border-bottom:0.5px solid #d8d2cb;
    margin-bottom:1.5rem;
    display:inline-block;
}
.form-item{
    margin-bottom:1rem;
}
label{
    display:block;
    font-size:0.9rem;
    color:#6c6965;
    margin-bottom:0.3rem;
}
input,textarea{
    width:400px;
    padding:0.6rem;
    border:0.5px solid #d8d2cb;
    background:#fffbf5;
    font-family:inherit;
    color:#4a4642;
}
textarea{
    height:140px;
    resize:none;
}
button{
    padding:0.6rem 1.6rem;
    border:0.5px solid #d8d2cb;
    background:#ede8e0;
    color:#4a4642;
    cursor:pointer;
}
button:hover{
    background:#e4dfd6;
}
.tip{
    font-size:0.75rem;
    color:#8a8580;
    margin-top:1rem;
}
.page-footer{
    margin-top:5rem;
    padding-top:1.5rem;
    border-top:0.5px solid #d8d2cb;
    text-align:center;
    font-size:0.7rem;
    color:#8a8580;
}
</style>
</head>
<body>
<div class="page-wrapper">
    <nav class="main-nav">
        <a href="index.html">首页</a>
        <a href="message.html">留言板</a>
    </nav>

    <section class="section">
        <h2>Message Board 留言板</h2>
        <p class="tip">留言功能预留，静态前端页面。</p>
        <form>
            <div class="form-item">
                <label>昵称</label>
                <input type="text" placeholder="请输入昵称">
            </div>
            <div class="form-item">
                <label>邮箱</label>
                <input type="email" placeholder="请输入邮箱">
            </div>
            <div class="form-item">
                <label>留言内容</label>
                <textarea placeholder="在这里写下你的留言..."></textarea>
            </div>
            <div class="form-item">
                <button type="button">提交留言</button>
            </div>
        </form>
    </section>

    <footer class="page-footer">
        Candidate test 1‑12
    </footer>
</div>
</body>
</html>
